# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml. Keep current:
# update in the same PR as any material change (layer, port, role, one-line
# description, exposed services). Schema: fleet-config/architecture/README.md.
layer       = "working-pipe"
icon        = "⛏️"
description = "Headless Bedrock Realm bot driven by an LLM decision loop on the hub."
# `tag` is a single [relation, target] pair — system-map.html renders exactly
# tag[0] and tag[1] — so this card cannot show both outward edges. The Realm
# keeps it: it is the system this repo exists to reach, and the one the map
# already carries as an `external` node. The second real dependency — the local
# LLM hub, which src/model-client.js routes the decision loop through — is named
# in `description` instead. Revisit only if the fleet-config schema ever grows
# multi-edge tags; don't silently swap the Realm out for the hub.
tag         = ["→", "Minecraft Realm"]
shape       = "node"
# `patches/` holds the patch-package patch that npm's postinstall applies; the
# `node` preset has no folder for it (docs/layout.md).
extra_roots = ["patches"]

# [vendored] -- components copied byte-for-byte from project-scaffolding, with the
# scaffold commit each came from. Re-vendor through /propagate-vendored, never by hand.
[vendored]
structure_ratchet = { src = "scripts/structure_ratchet.py", sha = "9d0fd2777fbae78aaffa7a0e53f62a201db5af79", dest = "scripts/structure_ratchet.py" }
structure_layout = { src = "scripts/structure_layout.py", sha = "713b1d1e36989440679ec4e415ff149b14d96c81", dest = "scripts/structure_layout.py" }
instruction_ratchet = { src = "scripts/instruction_ratchet.py", sha = "9d0fd2777fbae78aaffa7a0e53f62a201db5af79", dest = "scripts/instruction_ratchet.py" }
doc_refs_ratchet = { src = "scripts/doc_refs_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/doc_refs_ratchet.py" }
static_ratchet = { src = "scripts/static_ratchet.py", sha = "537cf3931b57e7453ed251850c0dbeac042b03bf", dest = "scripts/static_ratchet.py" }
docs_ratchet = { src = "scripts/docs_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/docs_ratchet.py" }
comment_ratchet = { src = "scripts/comment_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/comment_ratchet.py" }
dead_code_ratchet = { src = "scripts/dead_code_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/dead_code_ratchet.py" }
conventions_ratchet = { src = "scripts/conventions_ratchet.py", sha = "9d0fd2777fbae78aaffa7a0e53f62a201db5af79", dest = "scripts/conventions_ratchet.py" }

# [structure_ratchet] -- the scaffold's baseline-and-ratchet layout stage. `npm run
# verify` runs scripts/structure_ratchet.py and fails when a new file passes 1,000
# lines, a function 100 lines or a flat directory 40 modules, when a baselined
# offender grows past its size in .structure-ratchet-baseline.json, and when the
# root folders do not match `shape` plus `extra_roots`. Existing offenders are
# baselined at today's size, never excluded. Exit 3 (git unusable, an unparseable
# file, an unknown shape) fails the gate. Procedure: project-scaffolding
# docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"

# [instruction_ratchet] -- the scaffold's baseline-and-ratchet stage for the
# deterministic prompt-audit rules over CLAUDE.md and AGENTS.md. `npm run verify`
# runs scripts/instruction_ratchet.py and fails when a rule-hit count rises above
# .instruction-ratchet-baseline.json or CLAUDE.md passes its size cap. Existing
# hits are baselined, never excluded. Exit 3 (git unusable, an unreadable file)
# fails the gate. Needs Python 3.11+ (tomllib). Procedure: project-scaffolding
# docs/instruction-ratchet.md.
[instruction_ratchet]
enabled  = true
baseline = ".instruction-ratchet-baseline.json"

# [doc_refs_ratchet] -- the scaffold's baseline-and-ratchet stage for stale doc
# references. `npm run verify` runs scripts/doc_refs_ratchet.py and fails when
# README.md, CLAUDE.md or docs/**/*.md names a repo path or relative link that
# does not exist, beyond .doc-refs-ratchet-baseline.json. No `port` is declared
# above, so loopback ports in the docs are not checked. Exit 3 (git unusable, a
# non-UTF-8 doc, an unclosed fence) fails the gate. Needs Python 3.11+ (tomllib).
# Procedure: project-scaffolding docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled  = true
baseline = ".doc-refs-ratchet-baseline.json"
# allow_refs names paths on purpose that are not in this tree: the BedrockX files
# the patch edits (they live under node_modules/bedrockx/src, which this repo
# does not track; docs/setup-and-machines.md, docs/gotchas.md) and the gate
# script CLAUDE.md says this repo deliberately does not have.
allow_refs = [
  "scripts/verify-before-ship.ps1",
  "src/client.js",
  "src/createClient.js",
  "src/datatypes/compiler-minecraft.js",
  "src/nethernet.js",
  "src/nethernet/src/client.js",
  "src/protocol/protocol.json",
  "src/raknet/raknet.node",
  "src/raknet/win-raknet.node",
]

# [static_ratchet] -- the scaffold's baseline-and-ratchet stage for duplicated
# code (jscpd over src/, scripts/ and test/) and ruff's unused-name and bug rules.
# `npm run verify` runs scripts/static_ratchet.py and fails when a duplicate block
# is new relative to .static-ratchet-baseline.json. Needs `npx` (Node) and ruff
# for the gate's Python (`python -m ruff`); either missing is exit 3, NOT
# CONFIRMED, which fails the gate. Procedure: project-scaffolding
# docs/static-ratchet.md.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"

# [docs_ratchet] -- the scaffold's baseline-and-ratchet stage for the README and
# docs convention. `npm run verify` runs scripts/docs_ratchet.py and fails when the
# root README.md grows past its size in .docs-ratchet-baseline.json (40 KiB by
# default) or a file under README.md and docs/ gains an issue-number reference, a
# dated heading or a changelog heading. Exit 3 (git unusable, a non-UTF-8 doc, an
# unclosed fence) fails the gate. Needs Python 3.11+ (tomllib). Procedure:
# project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"

# [comment_ratchet] -- the scaffold's baseline-and-ratchet stage for history in code
# comments. `npm run verify` runs scripts/comment_ratchet.py and fails when a
# product-code file (src/, scripts/) gains an issue-number reference in a comment
# beyond .comment-ratchet-baseline.json. Tests (*.test.js) are not scanned. Exit 3
# (git unusable, an unterminated string or comment) fails the gate. Needs Python
# 3.11+ (tomllib). Procedure: project-scaffolding docs/comment-ratchet.md.
[comment_ratchet]
enabled  = true
baseline = ".comment-ratchet-baseline.json"

# [dead_code_ratchet] -- the scaffold's baseline-and-ratchet stage for definitions
# nothing references. `npm run verify` runs scripts/dead_code_ratchet.py and fails
# on a dead function, class or method not in .dead-code-ratchet-baseline.json. It
# parses Python only, and this repo's own code is JavaScript, so today it reads the
# vendored ratchet scripts (never reported) and finds nothing to baseline; it
# guards any Python helper added later. Exit 3 (git unusable, an unparseable .py
# file) fails the gate. Needs Python 3.11+ (tomllib). Procedure:
# project-scaffolding docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled  = true
baseline = ".dead-code-ratchet-baseline.json"

# [conventions_ratchet] -- the scaffold's baseline-and-ratchet stage for fleet
# conventions held as Python `ast` rules. `npm run verify` runs
# scripts/conventions_ratchet.py and fails when a tracked Python file gains a hit
# beyond .conventions-ratchet-baseline.json. It reads Python only, and this repo's
# code is JavaScript, so the rules below guard a Python helper added later. Exit 3
# (git unusable, an unparseable .py file) fails the gate. Needs Python 3.11+
# (tomllib). Procedure: project-scaffolding docs/conventions-ratchet.md.
#   no-window      kept: the Windows tower spawns the gate's Python helpers, and a
#                  spawn without CREATE_NO_WINDOW pops a console there.
#   no-drive-path  kept: the repo runs on the Windows tower and the Mac Mini, so a
#                  hardcoded drive-letter path is wrong on one of them.
#   logging-not-print  left off: its default scope is app/ and src/, which hold no
#                  Python here, and a Python helper in scripts/ is a CLI by nature.
#   secret-compare, git-wrapper  left off: the repo has neither helper.
[conventions_ratchet]
enabled  = true
baseline = ".conventions-ratchet-baseline.json"
rules    = ["no-window", "no-drive-path"]
